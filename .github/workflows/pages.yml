name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Build Mindloom
        run: |
          npm ci --prefix apps/mindloom
          npm run build --prefix apps/mindloom

      - name: Validate and build release notes feed
        run: node scripts/build-release-feed.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # GitHub Actions can briefly return an empty artifact listing immediately
      # after the Pages artifact is finalized. Allow that listing to propagate.
      - name: Wait for Pages artifact listing
        run: sleep 60

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
